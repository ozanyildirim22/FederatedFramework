[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ssfl"
version = "0.1.0"
description = "Plug-and-play Semi-Supervised Federated Learning framework"
requires-python = ">=3.9"
dependencies = ["torch>=2.0", "torchvision>=0.15", "numpy", "pyyaml", "medmnist>=3.0", "Pillow"]

[project.optional-dependencies]
dev = ["pytest"]
gui = ["gradio>=4.0", "matplotlib", "pandas"]

[project.scripts]
ssfl = "ssfl.__main__:main"
ssfl-gui = "ssfl.gui:main"

[tool.setuptools.packages.find]
include = ["ssfl*"]

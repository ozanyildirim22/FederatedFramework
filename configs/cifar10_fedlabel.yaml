# Cross-device setting: many small clients, partial participation.
name: cifar10_fedlabel
seed: 42
device: auto
data:
  dataset: cifar10
  root: ./data
  partitioner: dirichlet
  alpha: 1.0                  # ADD: 1.0 (near-IID) and 0.1 (severe non-IID)
  labeled_ratio: 0.2          # thesis: 0.2 and 0.5
  batch_size: 32
  unlabeled_batch_ratio: 7
model:
  name: resnet34                # FedLabel uses ResNet-34 for CIFAR-10 (ResNet-18 for MedMNIST)
  norm: gn
strategy:
  name: fedlabel              # supervised | pseudolabel | fixmatch | fedlabel
  local_epochs: 1
  # 15 SGD steps per client and round for every method (FedLabel: tau = tau' = 15).
  # One local epoch is only ~3 labeled steps (~100 labeled samples, batch 32) and ~1 unlabeled
  # step (~400 unlabeled samples, batch 224) here; the paper counts tau in local iterations and
  # found tau = 5 the worst. local_steps overrides local_epochs and FedLabel's sup/unsup_epochs.
  local_steps: 15
  lr: 0.03
  cudnn_benchmark: true       # fastest conv kernels per input shape (CUDA); results unchanged
  params:                     # FedLabel as in the ADD (Section 3.1, Algorithm 2)
    beta: 0.5                 # pseudo-label confidence threshold (paper appendix A: 0.3-0.5 best)
    lambda0: 1.0              # scale of the global-local consistency weight (lambda_0)
    lambda_u: 1.0             # weight of the pseudo-label cross-entropy
    sup_epochs: 1             # tau: used only without strategy.local_steps / sup_steps
    unsup_epochs: 1           # tau': used only without strategy.local_steps / unsup_steps
    confidence: variance      # h(.) = variance of the logits
    selection: adaptive       # adaptive | local | global (ablations)
    kl_direction: add         # add = KL(s(w_U) || s_bar) as in Eq. 2 | teacher
server:
  aggregator: fedavg
  rounds: 1000               # ADD Table 2: 1,000 communication rounds
  num_clients: 100
  client_fraction: 0.1
  eval_every: 5

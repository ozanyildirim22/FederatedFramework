# Cross-silo setting: few institutions, full participation, extreme label scarcity.
name: organamnist_fedlabel
seed: 42
device: auto
data:
  dataset: organamnist
  root: ./data
  image_size: 28
  partitioner: dirichlet
  alpha: 0.5
  labeled_ratio: 0.05         # thesis: 0.05 and 0.2
  batch_size: 32
  unlabeled_batch_ratio: 7
model:
  name: resnet18
  norm: gn
strategy:
  name: fedlabel
  local_epochs: 1
  lr: 0.03
  amp: false                # true = mixed precision (less VRAM, small speed-up)
  params:
    tau: 0.95
    lambda_u: 1.0
    lambda_kl: 1.0
    confidence: variance
    selection: adaptive
    local_warmup_steps: 5
server:
  aggregator: fedavg
  rounds: 100
  num_clients: 10
  client_fraction: 1.0
  eval_every: 1
